<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: #18181b; }
      h1 { margin: 0 0 4px; font-size: 15px; }
      p { margin: 0 0 12px; font-size: 12px; color: #71717a; }
      label { display: block; margin-bottom: 10px; font-size: 12px; font-weight: 600; color: #52525b; }
      input, select { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 7px 8px; border: 1px solid #d4d4d8; border-radius: 7px; font: inherit; }
      button { width: 100%; padding: 9px; border: none; border-radius: 7px; background: #facc15; font: 600 14px system-ui; cursor: pointer; }
      #estado { margin-top: 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Descuento</h1>
    <p>Configure uma vez. Depois é só usar o botão na página do produto.</p>
    <label>Endereço do site<input id="site" placeholder="http://localhost:3000" /></label>
    <label>Token<input id="token" type="password" placeholder="cole o token da página /extensao" /></label>
    <label>Categoria padrão<select id="categoria"><option value="">Nenhuma</option></select></label>
    <button id="salvar">Salvar</button>
    <p id="estado"></p>
    <script src="popup.js"></script>
  </body>
</html>
