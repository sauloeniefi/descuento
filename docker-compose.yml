services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: descuento
      POSTGRES_PASSWORD: descuento
      POSTGRES_DB: descuento
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U descuento -d descuento"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
